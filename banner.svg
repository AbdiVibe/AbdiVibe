<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#0D1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF88"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151C2C" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.5"/>

  <!-- top accent hairline -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- system label, top-left, terminal-style -->
  <text x="60" y="56" font-family="SFMono-Regular, Menlo, monospace" font-size="14" fill="#39FF88">abdimalik.dev — system online</text>

  <!-- primary identity -->
  <text x="60" y="140" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#F5F7FA">Abdimalik Dek Gadhaye</text>

  <!-- positioning line, not a job title -->
  <text x="60" y="180" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#9CA7B8">Founder building the future of developer productivity.</text>

  <!-- sub-line -->
  <text x="60" y="212" font-family="SFMono-Regular, Menlo, monospace" font-size="14" fill="#5B6472">Higsa — the intelligent workspace for software engineers · Jijiga, Ethiopia</text>

  <!-- blinking cursor after the sub-line, tasteful single accent -->
  <rect x="620" y="200" width="10" height="16" fill="#39FF88">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent hairline -->
  <rect x="0" y="297" width="1200" height="3" fill="url(#accent)"/>
</svg>
