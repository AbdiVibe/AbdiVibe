<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="380">
  <defs>
    <linearGradient id="tglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101625"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>
  </defs>

  <!-- window shadow -->
  <rect x="10" y="14" width="880" height="356" rx="12" fill="#000000" opacity="0.35"/>

  <!-- window body -->
  <rect x="0" y="0" width="880" height="356" rx="12" fill="url(#tglow)" stroke="#1E2636" stroke-width="1"/>

  <!-- chrome bar -->
  <rect x="0" y="0" width="880" height="36" rx="12" fill="#0D131F"/>
  <circle cx="20" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="18" r="6" fill="#27C93F"/>
  <text x="440" y="23" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-size="12" fill="#5B6472">abdimalik@higsa: ~/workspace</text>

  <!-- terminal lines -->
  <text x="28" y="72" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#5B6472">$ whoami</text>
  <text x="28" y="98" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#E5E9F0">founder, lead engineer — building Higsa</text>

  <text x="28" y="136" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#5B6472">$ higsa status --mission</text>
  <text x="28" y="162" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#39FF88">unifying project management, docs, learning &amp; AI workflows</text>

  <text x="28" y="200" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#5B6472">$ security --focus</text>
  <text x="28" y="226" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#38BDF8">application security · secure SDLC · linux hardening</text>

  <text x="28" y="264" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#5B6472">$ build --in-public</text>
  <text x="28" y="290" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#E5E9F0">shipping continuously from Jijiga, Ethiopia</text>

  <!-- prompt line with blinking cursor -->
  <text x="28" y="328" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#5B6472">$</text>
  <rect x="46" y="315" width="10" height="18" fill="#39FF88">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
