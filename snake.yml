# Place this file at: .github/workflows/snake.yml
# in your AbdiVibe/AbdiVibe repository.
#
# What it does: regenerates an SVG that animates your real contribution
# graph as a snake eating your commit squares, on a schedule, and commits
# it to a dedicated `output` branch — which the README references via:
# https://raw.githubusercontent.com/AbdiVibe/AbdiVibe/output/github-contribution-grid-snake-dark.svg
#
# This is the ONE animation worth keeping: it's generated from your real
# data, not decorative, and it's a well-established, credible pattern
# (used by large, respected profiles) rather than a novelty GIF.

name: generate-snake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # allows manual trigger from the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: AbdiVibe
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      - name: push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
